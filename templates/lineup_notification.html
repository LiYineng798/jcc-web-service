<!doctype html>
{% from "theme_toggle.html" import theme_toggle %}
{% from "seo_head.html" import seo_head %}
<html lang="zh-CN">
  <head>
{{ seo_head(seo) }}
    <link rel="stylesheet" href="{{ static_v('moderation.css') }}" />
  </head>
  <body>
    <main class="page-shell lm-notification-page">
      <nav class="nav-bar" aria-label="页面工具">
        <a class="ghost-link" href="/?notifications=open">返回通知</a>
        {{ theme_toggle() }}
      </nav>
      <section class="panel" id="lineupNotificationDetail" data-lineup-id="{{ lineup_id }}" aria-label="阵容处理详情" aria-busy="true">通知加载中…</section>
    </main>
    <script src="{{ static_v('theme-toggle.js') }}" defer></script>
    <script src="{{ static_v('lineup-moderation.js') }}" defer></script>
    <script src="{{ static_v('lineup-notification-detail.js') }}" defer></script>
  </body>
</html>
