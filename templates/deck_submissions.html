<!doctype html>
{% from "seo_head.html" import seo_head %}
{% from "theme_toggle.html" import theme_toggle %}
<html lang="zh-CN">
  <head>
{{ seo_head(seo) }}
    <link rel="stylesheet" href="{{ static_v('orange-decks.css') }}" />
    <link rel="stylesheet" href="{{ static_v('deck-submissions.css') }}" />
  </head>
  <body class="deck-page submissions-page">
    <div class="page-shell submissions-shell" id="submissionsApp" data-submission-id="{{ submission_id }}" data-limits='{{ limits|tojson }}'>
      <nav class="deck-page-nav" aria-label="页面工具">
        {% if submission_id %}<a href="/me/deck-submissions">← 我的投稿</a>{% else %}<a href="/?library=decks">← 卡组库</a>{% endif %}
        <div class="nav-actions"><a href="/lineup/new">新投稿</a>{{ theme_toggle('nav-icon-button') }}</div>
      </nav>
      <header class="submissions-head">
        <p class="deck-kicker">大橘大利卡组投稿</p>
        <h1 id="submissionsTitle">{% if submission_id %}投稿进度{% else %}我的投稿{% endif %}</h1>
      </header>
      <main id="submissionsBody" aria-live="polite" aria-busy="true"><p class="submissions-loading">正在读取…</p></main>
    </div>
    <script src="{{ static_v('theme-toggle.js') }}" defer></script>
    <script src="{{ static_v('deck-submissions.js') }}" defer></script>
  </body>
</html>
