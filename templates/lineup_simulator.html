<!DOCTYPE html>
{% from "seo_head.html" import seo_head %}
<html lang="zh-cn">
  <head>
{{ seo_head(seo, include_site_assets=False) }}
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="{{ static_v('tools/lineup-simulator/style.css') }}" />
  </head>
  <body>
    <header class="sim-topbar">
      <a class="sim-brand" href="/" aria-label="返回金铲铲阵容库">
        <span class="sim-brand-mark">阵</span>
        <span><strong>阵容模拟器</strong><small>JCC LAB</small></span>
      </a>
      <div class="season-switcher" id="seasonSwitcher" aria-label="选择赛季"></div>
      <nav class="top-actions" aria-label="棋盘操作">
        <button class="icon-button" id="undoButton" type="button" title="撤销" aria-label="撤销"><i data-lucide="undo-2"></i></button>
        <button class="icon-button" id="redoButton" type="button" title="重做" aria-label="重做"><i data-lucide="redo-2"></i></button>
        <button class="icon-button" id="exportImageButton" type="button" title="保存阵容图" aria-label="保存阵容图"><i data-lucide="camera"></i></button>
        <button class="icon-button" id="shareButton" type="button" title="复制阵容链接" aria-label="复制阵容链接"><i data-lucide="share-2"></i></button>
        <button class="icon-button danger" id="resetButton" type="button" title="清空棋盘" aria-label="清空棋盘"><i data-lucide="trash-2"></i></button>
      </nav>
    </header>

    <main class="sim-shell" id="simulatorRoot" data-season-data-version="{{ season_data_stamp() }}">
      <section class="sim-heading">
        <div>
          <p class="eyebrow">TEAM PLANNER</p>
          <h1>构筑你的阵容</h1>
          <p id="seasonMeta">正在加载赛季资料...</p>
        </div>
        <div class="heading-actions">
          <label class="toggle-control">
            <input id="showNamesToggle" type="checkbox" checked />
            <span></span>显示名称
          </label>
          <button class="text-button" id="importButton" type="button"><i data-lucide="download"></i>导入</button>
          <button class="text-button" id="exportButton" type="button"><i data-lucide="copy"></i>导出</button>
        </div>
      </section>

      <section class="workspace" aria-label="阵容编辑区">
        <aside class="trait-rail tool-panel" aria-label="已激活羁绊">
          <div class="panel-title-row">
            <div><span class="panel-kicker">SYNERGIES</span><h2>阵容羁绊</h2></div>
            <span class="panel-count" id="activeTraitCount">0</span>
          </div>
          <div class="trait-summary" id="traitSummary">
            <div class="empty-state compact">添加弈子后显示羁绊</div>
          </div>
        </aside>

        <section class="board-stage" id="boardCapture">
          <div class="board-toolbar">
            <div class="board-stat"><i data-lucide="users"></i><strong id="unitCount">0</strong><span>/ 28</span></div>
            <div class="board-stat gold-stat"><img src="/static/tools/lineup-simulator/ui/gold.png" alt="费用" /><strong id="totalCost">0</strong><span>总费用</span></div>
            <div class="board-hint"><i data-lucide="layout-grid"></i><span id="boardStatus">阵容未配置</span></div>
          </div>
          <div class="hex-board-wrap">
            <div class="hex-board" id="boardGrid" role="grid" aria-label="4 行 7 列阵容棋盘"></div>
          </div>
          <div class="board-footer">
            <div class="component-summary-wrap">
              <span class="footer-label">散件需求</span>
              <div class="component-summary" id="componentSummary"><span class="muted">暂无装备</span></div>
            </div>
            <div class="selected-help" id="selectedHelp" hidden></div>
          </div>
        </section>

        <aside class="item-rail tool-panel" aria-label="装备库">
          <div class="panel-title-row">
            <div><span class="panel-kicker">ITEMS</span><h2>装备库</h2></div>
          </div>
          <div class="item-tabs" id="itemTabs" role="tablist"></div>
          <label class="search-field compact-search">
            <i data-lucide="search"></i>
            <input id="itemSearch" type="search" placeholder="搜索装备" autocomplete="off" />
          </label>
          <div class="item-grid" id="itemGrid"></div>
        </aside>
      </section>

      <section class="roster-panel tool-panel">
        <div class="roster-toolbar">
          <div>
            <span class="panel-kicker">CHAMPIONS</span>
            <h2>弈子库</h2>
          </div>
          <label class="search-field hero-search">
            <i data-lucide="search"></i>
            <input id="heroSearch" type="search" placeholder="搜索弈子名称" autocomplete="off" />
          </label>
          <div class="trait-picker" id="traitFilterPicker">
            <button class="trait-picker-trigger" id="traitFilterButton" type="button" aria-haspopup="listbox" aria-expanded="false" aria-controls="traitFilterMenu">
              <span class="trait-filter-current-icon" id="traitFilterIcon"><i data-lucide="shapes"></i></span>
              <span class="trait-filter-current-label" id="traitFilterLabel">全部羁绊</span>
              <i class="trait-picker-chevron" data-lucide="chevron-down"></i>
            </button>
            <button id="traitFilterClear" class="trait-filter-clear" type="button" title="清除羁绊筛选" aria-label="清除羁绊筛选" hidden><i data-lucide="x"></i></button>
            <div class="trait-filter-menu" id="traitFilterMenu" role="listbox" aria-label="羁绊筛选" hidden></div>
          </div>
          <div class="cost-filters" id="costFilters" aria-label="费用筛选"></div>
        </div>
        <div class="hero-groups" id="heroGroups" aria-live="polite"></div>
      </section>
    </main>

    <div class="detail-popover" id="detailPopover" role="tooltip" hidden></div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <dialog class="code-dialog" id="codeDialog">
      <form method="dialog">
        <div class="dialog-heading">
          <div><span class="panel-kicker">FORMATION CODE</span><h2 id="codeDialogTitle">导入阵容</h2></div>
          <button class="icon-button" value="cancel" aria-label="关闭"><i data-lucide="x"></i></button>
        </div>
        <p id="codeDialogHint">阵容码</p>
        <textarea id="formationCode" rows="7" spellcheck="false"></textarea>
        <div class="dialog-actions">
          <button class="text-button" value="cancel">取消</button>
          <button class="primary-button" id="confirmCodeButton" type="button">确认导入</button>
        </div>
      </form>
    </dialog>

    <dialog class="export-image-dialog" id="exportImageDialog">
      <form method="dialog">
        <div class="dialog-heading">
          <div><span class="panel-kicker">LINEUP IMAGE</span><h2>保存阵容图</h2></div>
          <button class="icon-button" value="cancel" aria-label="关闭"><i data-lucide="x"></i></button>
        </div>
        <label class="export-image-option">
          <span><strong>阵容羁绊</strong><small>在图片左侧展示当前阵容的羁绊列表</small></span>
          <input id="exportIncludeTraits" type="checkbox" checked />
          <span class="toggle-track"></span>
        </label>
        <label class="export-image-option">
          <span><strong>透明背景</strong><small>导出带透明通道的 PNG 图片</small></span>
          <input id="exportTransparentBackground" type="checkbox" />
          <span class="toggle-track"></span>
        </label>
        <div class="dialog-actions">
          <button class="text-button" value="cancel">取消</button>
          <button class="primary-button" id="confirmExportImageButton" type="button"><i data-lucide="image-down"></i>保存图片</button>
        </div>
      </form>
    </dialog>

    <script src="{{ static_v('vendor/lucide/lucide.min.js') }}"></script>
    <script src="{{ static_v('tools/lineup-simulator/vendor/html-to-image.min.js') }}"></script>
    <script src="{{ static_v('tools/lineup-simulator/app.js') }}" type="module"></script>
  </body>
</html>
