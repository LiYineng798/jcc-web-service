<!doctype html>
{% from "theme_toggle.html" import theme_toggle %}
{% from "seo_head.html" import seo_head %}
<html lang="zh-CN">
  <head>
{{ seo_head(seo) }}
    <link rel="stylesheet" href="{{ url_for('static', filename='s18-preview.css') }}" />
  </head>
  <body>
    <div class="page-shell s18-preview-page">
      <nav class="nav-bar s18-preview-nav" aria-label="页面工具">
        <a class="brand-mark brand-link" href="/" aria-label="返回首页">阵</a>
        <div class="nav-actions">
          <a class="ghost-link nav-tool-link" href="/">返回首页</a>
          {{ theme_toggle("nav-icon-button") }}
        </div>
      </nav>

      <header class="s18-preview-hero">
        <p class="eyebrow">S18 Set Preview</p>
        <div class="s18-preview-title-row">
          <h1>S18版本前瞻</h1>
          <span class="s18-preview-count" id="previewCount">资料加载中</span>
        </div>
      </header>

      <div class="s18-main-tabs" role="tablist" aria-label="S18资料分类">
        <button class="s18-main-tab active" type="button" data-view="champions" role="tab" aria-selected="true" aria-controls="championsPanel">弈子</button>
        <button class="s18-main-tab" type="button" data-view="traits" role="tab" aria-selected="false" aria-controls="traitsPanel">羁绊</button>
        <button class="s18-main-tab" type="button" data-view="wands" role="tab" aria-selected="false" aria-controls="wandsPanel">法杖</button>
        <span class="s18-tab-indicator" aria-hidden="true"></span>
      </div>

      <main class="s18-preview-content" id="s18PreviewContent" aria-live="polite" aria-busy="true">
        <section class="s18-view-panel active" id="championsPanel" data-panel="champions" role="tabpanel">
          <div class="champion-filter-panel">
            <div class="champion-filter-row">
              <label class="s18-search-field" for="championSearch">
                <span>搜索弈子</span>
                <input id="championSearch" type="search" autocomplete="off" placeholder="输入弈子名称" />
              </label>
              <div class="champion-filter-group">
                <span class="champion-filter-label">种族</span>
                <div class="champion-filter-options" id="originFilters" aria-label="按种族筛选"></div>
              </div>
              <div class="champion-filter-group">
                <span class="champion-filter-label">职业</span>
                <div class="champion-filter-options" id="professionFilters" aria-label="按职业筛选"></div>
              </div>
              <div class="champion-filter-group">
                <span class="champion-filter-label">费用</span>
                <div class="champion-filter-options" id="costFilters" aria-label="按费用筛选"></div>
              </div>
              <label class="skill-toggle" for="skillToggle">
                <span>显示技能</span>
                <input id="skillToggle" type="checkbox" checked />
                <span class="skill-toggle-track" aria-hidden="true"><span></span></span>
              </label>
            </div>
          </div>
          <div id="championSections"></div>
          <div class="s18-empty-state hidden" id="championEmpty"><strong>没有找到弈子</strong><span>调整搜索词或筛选条件后再试。</span></div>
        </section>

        <section class="s18-view-panel" id="traitsPanel" data-panel="traits" role="tabpanel" hidden>
          <div class="trait-type-switch" role="tablist" aria-label="羁绊类型">
            <button class="active" type="button" data-trait-type="origin" role="tab" aria-selected="true">种族</button>
            <button type="button" data-trait-type="profession" role="tab" aria-selected="false">职业</button>
          </div>
          <div class="trait-grid" id="traitGrid"></div>
        </section>

        <section class="s18-view-panel" id="wandsPanel" data-panel="wands" role="tabpanel" hidden>
          <div class="wand-grid" id="wandGrid"></div>
        </section>

        <div class="s18-loading" id="s18Loading">正在整理 S18 资料...</div>
        <div class="s18-load-error hidden" id="s18LoadError" role="alert">资料加载失败，请刷新页面后重试。</div>
      </main>
    </div>
    <script src="{{ url_for('static', filename='theme-toggle.js') }}" defer></script>
    <script src="{{ url_for('static', filename='s18-preview.js') }}" defer></script>
  </body>
</html>
