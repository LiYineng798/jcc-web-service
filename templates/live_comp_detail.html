<!doctype html>
{% from "seo_head.html" import seo_head %}
<html lang="zh-CN"><head>
{{ seo_head(seo) }}
<link rel="stylesheet" href="{{ static_v('live-comp-detail.css') }}" />
</head><body>
<header class="detail-topbar"><a href="/" data-home-return>← 返回实时阵容</a></header>
<main class="detail-shell" id="liveCompDetail" data-season-id="{{ season_id }}" data-live-comp-id="{{ live_comp_id }}">
  <section class="detail-heading"><h1>{{ item.title }}</h1><span id="detailSeason" role="status">正在加载阵容资料...</span></section>
  <section class="board-panel" aria-label="阵容棋盘">
    <div class="board-container">
      <div class="formation-board-wrapper">
        <div class="formation-board" id="formationBoard" role="group" aria-label="4 行 7 列阵容棋盘"></div>
        <p class="unit-detail" id="unitDetail" role="status"></p>
      </div>
      <section class="trait-panel" aria-labelledby="traitHeading" hidden><h2 id="traitHeading">激活羁绊</h2><div id="traitPanel"></div></section>
    </div>
  </section>
</main>
<script src="{{ static_v('unit-star-icons.js') }}" defer></script>
<script src="{{ static_v('live-comp-detail.js') }}" defer></script>
<script src="{{ static_v('home-navigation.js') }}" defer></script>
</body></html>
