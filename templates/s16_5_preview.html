<!doctype html>
{% from "theme_toggle.html" import theme_toggle %}
{% from "seo_head.html" import seo_head %}
<html lang="zh-CN">
  <head>
{{ seo_head(seo) }}
    <link rel="stylesheet" href="{{ url_for('static', filename='s18-preview.css') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='s16-5-preview.css') }}" />
  </head>
  <body>
    <div class="page-shell s18-preview-page s16-preview-page">
      <nav class="nav-bar s18-preview-nav" aria-label="页面工具">
        <a class="brand-mark brand-link" href="/" aria-label="返回首页">阵</a>
        <div class="nav-actions">
          <a class="ghost-link nav-tool-link" href="/">返回首页</a>
          {{ theme_toggle("nav-icon-button") }}
        </div>
      </nav>

      <header class="s18-preview-hero">
        <p class="eyebrow">S16.5 Hextech Compendium</p>
        <div class="s18-preview-title-row">
          <h1>S16.5英雄联盟传奇·海克斯宝典</h1>
          <span class="s18-preview-count" id="previewCount">资料加载中</span>
        </div>
      </header>

      <main class="s18-preview-content" id="s16PreviewContent" aria-live="polite" aria-busy="true">
        <section class="s18-view-panel active" aria-label="S16.5弈子">
          <button class="champion-filter-toggle" id="championFilterToggle" type="button" aria-expanded="false" aria-controls="championFilterPanel">
            <span class="champion-filter-toggle-copy"><strong>筛选弈子</strong><span id="championFilterSummary">全部条件</span></span>
            <span class="champion-filter-toggle-chevron" aria-hidden="true">⌄</span>
          </button>
          <div class="champion-filter-panel" id="championFilterPanel">
            <div class="champion-filter-row">
              <label class="s18-search-field" for="championSearch"><span>搜索弈子</span><input id="championSearch" type="search" autocomplete="off" placeholder="搜索弈子或羁绊" /></label>
              <div class="champion-filter-group"><span class="champion-filter-label">种族</span><div class="champion-filter-options" id="originFilters" aria-label="按种族筛选"></div></div>
              <div class="champion-filter-group"><span class="champion-filter-label">职业</span><div class="champion-filter-options" id="professionFilters" aria-label="按职业筛选"></div></div>
              <div class="champion-filter-group"><span class="champion-filter-label">费用</span><div class="champion-filter-options" id="costFilters" aria-label="按费用筛选"></div></div>
              <label class="skill-toggle" for="skillToggle"><span>显示技能</span><input id="skillToggle" type="checkbox" checked /><span class="skill-toggle-track" aria-hidden="true"><span></span></span></label>
            </div>
          </div>
          <div id="championSections"></div>
          <div class="s18-empty-state hidden" id="championEmpty"><strong>没有找到弈子</strong><span>调整搜索词或筛选条件后再试。</span></div>
        </section>
        <div class="s18-loading" id="s16Loading">正在整理 S16.5 资料...</div>
        <div class="s18-load-error hidden" id="s16LoadError" role="alert">资料加载失败，请刷新页面后重试。</div>
      </main>
    </div>
    <script src="{{ url_for('static', filename='theme-toggle.js') }}" defer></script>
    <script src="{{ url_for('static', filename='s16-5-preview.js') }}" defer></script>
  </body>
</html>
